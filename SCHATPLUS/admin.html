<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>schat+ — Admin</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app-shell">
<aside class="sidebar"><div class="brand"><span class="brand-ball">◉</span><span>schat<span>+</span></span></div><div class="menu-title">ADMIN</div>
<button class="menu-item active" data-tab="users">👥 <span>Utilisateurs</span></button><button class="menu-item" data-tab="questions">❓ <span>Questions</span></button><button class="menu-item" data-tab="ais">🤖 <span>IA</span></button><button class="menu-item" data-tab="stats">📊 <span>Stats</span></button><button class="menu-item" data-tab="subscriptions">💎 <span>Abonnements</span></button><button class="menu-item" data-tab="chatgpt">🧠 <span>ChatGPT Admin</span></button>

<main class="main"><header class="topbar"><div><div class="eyebrow">ESPACE PRIVÉ</div><h1>Dashboard admin</h1></div><div id="adminState" class="account-chip">Non connecté</div></header>

<section id="dashboard" class="hidden"><div id="tab-users" class="admin-tab"></div><div id="tab-questions" class="admin-tab hidden"></div><div id="tab-ais" class="admin-tab hidden"></div><div id="tab-stats" class="admin-tab hidden"></div><div id="tab-subscriptions" class="admin-tab hidden"></div><div id="tab-chatgpt" class="admin-tab hidden"></div></section>
</main></div><script type="module" src="admin.js"></script>
</body></html>
