<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — schat+</title><link rel="stylesheet" href="style.css"></head><body class="auth-body"><main class="auth-card"><div class="brand"><span class="brand-dot">✦</span> schat+</div><h1>Connexion</h1><p>Connecte-toi pour accéder à schat+ et à Poképléx.</p><form id="loginForm"><label>Email<input id="email" type="email" required placeholder="ton@email.com"></label><label>Mot de passe<input id="password" type="password" required placeholder="Mot de passe"></label><button class="primary wide" type="submit">Se connecter</button><button class="secondary wide" type="button" id="setupAdmin">Configurer le mot de passe admin</button><p id="error" class="auth-error"></p></form><a href="register.html">Créer un compte</a></main><script type="module" src="auth.js"></script><script>document.getElementById("setupAdmin").onclick=()=>{const email=document.getElementById("email").value.trim().toLowerCase();if(email!=="nolhandespres14@gmail.com"){document.getElementById("error").textContent="Entre d’abord l’email admin.";return}const p=prompt("Choisis le mot de passe admin (garde-le secret) :");if(!p||p.length<6){document.getElementById("error").textContent="Mot de passe trop court (6 caractères minimum).";return}let h=2166136261;for(let i=0;i<p.length;i++){h^=p.charCodeAt(i);h=Math.imul(h,16777619)}const hash=(h>>>0).toString(16);localStorage.setItem("schat_plus_admin_password_v1",hash);document.getElementById("error").textContent="Mot de passe admin configuré. Tu peux maintenant te connecter."};</script></body></html>
